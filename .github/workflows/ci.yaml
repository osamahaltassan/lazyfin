name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check dependency age
        run: python3 scripts/check-dependency-age.py

      - name: Build
        run: dotnet build Lazyfin.slnx --configuration Release

      - name: Test
        run: dotnet test Lazyfin.slnx --configuration Release --no-build
