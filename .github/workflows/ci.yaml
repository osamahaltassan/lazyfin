name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check dependency age
        run: python3 scripts/check-dependency-age.py

      - name: Build
        run: dotnet build Lazyfin.slnx --configuration Release

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lazyfin-dev/servers
          key: jellyfin-api-${{ hashFiles('scripts/dev.sh') }}

      - name: Download each server build's Jellyfin.Api.dll
        run: scripts/dev.sh api

      - name: Test
        run: dotnet test Lazyfin.slnx --configuration Release --no-build

      - name: Build plugin zip
        run: scripts/jprm.sh zip 0.0.0.0 artifacts
